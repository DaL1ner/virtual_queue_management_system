<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Очередь</title>

<style>

body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f1f5f9;
}

/* текущий вызванный */

.current{
    background:#2563eb;
    color:white;
    padding:30px 20px;
    text-align:center;
}

.current-title{
    font-size:14px;
    opacity:.8;
}

.current-number{
    font-size:56px;
    font-weight:700;
    margin-top:10px;
}

/* карточка пользователя */

.my-ticket{
    background:white;
    margin:16px;
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

.my-position{
    font-size:14px;
    color:#64748b;
}

.my-number{
    font-size:28px;
    font-weight:700;
    margin-top:6px;
}

.my-name{
    margin-top:4px;
    color:#334155;
}

/* список */

.queue{
    margin:16px;
}

.queue-title{
    font-size:16px;
    font-weight:600;
    margin-bottom:10px;
}

.queue-item{
    background:white;
    border-radius:10px;
    padding:14px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.q-number{
    font-weight:600;
    font-size:18px;
}

.q-name{
    font-size:14px;
    color:#64748b;
}

</style>

</head>

<body>

<div class="current">
<div class="current-title">Сейчас вызывается</div>
<div class="current-number">A012</div>
</div>

<div class="my-ticket">
<div class="my-position">Ваш номер в очереди</div>
<div class="my-number">A018</div>
<div class="my-name">Иванов Иван</div>
</div>

<div class="queue">

<div class="queue-title">Очередь</div>

<div class="queue-item">
<div>
<div class="q-number">A013</div>
<div class="q-name">Петров П.</div>
</div>
</div>

<div class="queue-item">
<div>
<div class="q-number">A014</div>
<div class="q-name">Сидоров С.</div>
</div>
</div>

<div class="queue-item">
<div>
<div class="q-number">A015</div>
<div class="q-name">Кузнецов К.</div>
</div>
</div>

<div class="queue-item">
<div>
<div class="q-number">A016</div>
<div class="q-name">Смирнова А.</div>
</div>
</div>

<div class="queue-item">
<div>
<div class="q-number">A017</div>
<div class="q-name">Фёдоров Ф.</div>
</div>
</div>

</div>

</body>
</html>
