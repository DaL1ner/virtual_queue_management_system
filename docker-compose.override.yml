# docker-compose.override.yml
# Переопределения для Development-режима
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: final
      args:
        BUILD_CONFIGURATION: Debug
    
    volumes:
      # Фронтенд-сборки для раздачи статики в dev-режиме
      # Позволяет обновлять статику без пересборки контейнера
      - ./frontend/client/client-interface/dist:/app/wwwroot/client:cached
      - ./frontend/user/user-interface/dist:/app/wwwroot/app:cached
    
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s