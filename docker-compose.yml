services:
  db:
    image: postgres:16
    container_name: vqms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vqms_db
      POSTGRES_USER: vqms_user
      POSTGRES_PASSWORD: vqms_password
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vqms_user -d vqms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vqms_net

